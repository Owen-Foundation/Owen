<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#111111"/>
  <!-- abstract board — 2×2 grid, bottom-right offset, corporate/monochrome -->
  <g transform="translate(256,200)">
    <!-- top-left — solid white -->
    <rect x="-70" y="-70" width="62" height="62" rx="12" fill="#ffffff"/>
    <!-- top-right — white 55% -->
    <rect x="8" y="-70" width="62" height="62" rx="12" fill="#ffffff" opacity="0.55"/>
    <!-- bottom-left — white 55% -->
    <rect x="-70" y="8" width="62" height="62" rx="12" fill="#ffffff" opacity="0.55"/>
    <!-- bottom-right — offset + outline (the "breakout" square) -->
    <g transform="translate(14,14)">
      <rect x="8" y="8" width="62" height="62" rx="12" fill="none" stroke="#ffffff" stroke-width="3.2" opacity="0.95"/>
      <rect x="8" y="8" width="62" height="62" rx="12" fill="#ffffff" opacity="0.12"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="256" y="395" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="14" fill="#ffffff">OWEN<tspan font-weight="300" letter-spacing="8">2</tspan></text>
  <text x="256" y="418" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="500" font-size="11.5" letter-spacing="8.5" fill="#ffffff" opacity="0.45">OWEN FOUNDATION</text>
  <rect x="176" y="428" width="160" height="1" rx="0.5" fill="#ffffff" opacity="0.15"/>
  <text x="256" y="448" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400" font-size="8.5" letter-spacing="4" fill="#ffffff" opacity="0.28">OPEN SOURCE CHESS ENGINE • GPL-3.0</text>
</svg>
